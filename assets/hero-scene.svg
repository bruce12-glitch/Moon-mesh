<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-labelledby="heroArtTitle heroArtDesc">
  <title id="heroArtTitle">A little moon, a very cozy afternoon</title>
  <desc id="heroArtDesc">Miso, a small cream kitten in a pink scarf, colors an open book while sitting on a butter-yellow crescent moon. Pip the star brings a crayon. A sleepy lavender cloud, a tiny ringed planet and a potted sprout float nearby. Original flat-color pen illustration.</desc>
