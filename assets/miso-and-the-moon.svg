<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-labelledby="studioPageTitle studioPageDesc">
  <title id="studioPageTitle">Miso and the Moon coloring page</title>
  <desc id="studioPageDesc">A coloring page of Miso the kitten sitting in a crescent moon boat with a crayon, a star, a cloud, and a tiny planet.</desc>
  <g fill="#FFFDF7" stroke="#241C2E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- orbit doodle -->
    <path fill="none" stroke-width="3" stroke-dasharray="4 13" opacity=".45" d="M48 130c34-62 108-90 186-74 76 16 150 74 192 152"/>

    <!-- tiny planet -->
    <g data-part="Tiny planet">
      <circle cx="438" cy="112" r="34"/>
      <ellipse cx="438" cy="112" rx="54" ry="15" fill="none" stroke-width="4" transform="rotate(-18 438 112)"/>
    </g>
    <circle cx="448" cy="102" r="6" fill="none" stroke-width="3"/>

    <!-- cloud -->
    <path data-part="Little cloud" d="M52 190c-5-25 15-44 38-40 7-25 41-33 58-11 22-9 43 6 41 28 20 3 29 22 19 38-10 17-32 19-51 18l-70-2c-19 0-31-13-35-31Z"/>

    <!-- stars -->
    <path data-part="Big star" d="M148 52c5 20 11 26 31 31-20 5-26 11-31 31-5-20-11-26-31-31 20-5 26-11 31-31Z"/>
    <path data-part="Little star" d="M80 272c3 13 7 17 20 20-13 3-17 7-20 20-3-13-7-17-20-20 13-3 17-7 20-20Z"/>
    <path data-part="Tiny star" d="M448 232c2 9 5 12 14 14-9 2-12 5-14 14-2-9-5-12-14-14 9-2 12-5 14-14Z" stroke-width="4"/>

    <!-- moon boat -->
    <path data-part="Crescent moon" d="M68 172c0 206 92 296 192 296s192-90 192-296c-40 158-102 214-192 214S108 330 68 172Z"/>

    <!-- Miso -->
    <g>
      <!-- tail -->
      <path data-part="Miso’s tail" d="M342 374c48-8 78 12 78 40 0 23-17 38-35 31-14-5-15-19-4-25 7-4 13 0 14 6 5-8-2-20-19-22-11-1-24 2-34 8Z"/>
      <!-- body -->
      <path data-part="Miso’s body" d="M212 332c-16 26-12 64 8 82 20 18 72 18 92 0 20-18 24-56 8-82-18-29-90-30-108 0Z"/>
      <!-- feet -->
      <path d="M215 398c-10 0-18 9-18 22 0 15 9 25 22 25 12 0 20-10 20-24 0-14-9-23-24-23Z" stroke-width="5"/>
      <path d="M309 398c10 0 18 9 18 22 0 15-9 25-22 25-12 0-20-10-20-24 0-14 9-23 24-23Z" stroke-width="5"/>
      <path d="M215 414c4-1 7 1 8 5 1 4-2 7-6 6-3-1-4-4-2-11Zm96 0c-4-1-7 1-8 5-1 4 2 7 6 6 3-1 4-4 2-11Z" stroke-width="3"/>
      <!-- ears -->
      <path data-part="Left ear" d="M218 282c-8-20-8-42-2-48 8-8 26 2 39 21l10 18Z"/>
      <path data-part="Right ear" d="M306 282c8-20 8-42 2-48-8-8-26 2-39 21l-10 18Z"/>
      <!-- face -->
      <path data-part="Miso’s face" d="M204 300c0-37 25-62 58-62s58 25 58 62c0 44-25 70-58 70s-58-26-58-70Z"/>
      <path data-part="Left inner ear" fill="#FFFDF7" d="M210 292c-6-14-6-28-2-32 5-5 13 1 20 11l6 11Z"/>
      <path data-part="Right inner ear" fill="#FFFDF7" d="M314 292c6-14 6-28 2-32-5-5-13 1-20 11l-6 11Z"/>
      <path fill="#241C2E" stroke="none" d="M230 290c5-6 14-6 19 0 3 5 2 13-1 17-2 3-4 4-7 4s-5-1-7-4c-3-4-4-12-1-17Zm45 0c5-6 14-6 19 0 3 5 2 13-1 17-2 3-4 4-7 4s-5-1-7-4c-3-4-4-12-1-17Z"/>
      <circle cx="239" cy="294" r="3" fill="#FFFDF7" stroke="none"/>
      <circle cx="284" cy="294" r="3" fill="#FFFDF7" stroke="none"/>
      <path fill="#241C2E" d="M251 311c4-5 15-5 19 0-2 7-6 10-9 10s-8-3-10-10Z"/>
      <path fill="none" stroke-width="3" d="M261 322c-4 6-9 7-15 4m15-4c4 6 9 7 15 4"/>
      <path fill="none" stroke-width="4" d="M224 307h-9m10 8-9 3m81-11h9m-10 8 9 3"/>
      <!-- bandana -->
      <path data-part="Bandana" d="M221 346c17 12 43 13 60 3l-5 22c-16 11-34 10-49-1Z"/>
      <path data-part="Bandana knot" d="M281 350c9-7 20-5 27 5-9 7-19 6-27-5Z"/>
      <path fill="#FFFDF7" d="M272 353c2 4 6 7 10 7s8-3 9-7Z" stroke-width="4"/>
      <!-- crayon arm -->
      <path d="M206 347c-16 6-25 19-22 32 2 12 17 16 28 7 9-8 10-22 4-32-2-3-5-5-10-7Z" stroke-width="5"/>
      <!-- crayon -->
      <g transform="rotate(-34 348 316)">
        <path data-part="Crayon body" d="M334 300h27v53h-27Z"/>
        <path data-part="Crayon tip" d="M334 300l13-18 14 18Z"/>
        <path fill="#241C2E" stroke="none" d="M347 282l6 9h-12Z"/>
        <path fill="none" stroke-width="4" d="M334 316h27M334 333h27"/>
      </g>
      <path d="M326 322c-13 2-23 11-25 23-2 13 10 23 23 18 12-4 16-19 10-30-2-5-5-8-8-11Z" stroke-width="5"/>
      <!-- little sprinkle on bandana -->
      <path fill="none" stroke-width="3" d="M238 354c1 3 3 4 6 4-3 1-5 2-6 5-1-3-3-4-6-5 3 0 5-1 6-4Z"/>
    </g>

    <!-- moon face -->
    <g fill="none" stroke-width="4">
      <path d="M154 388c10 7 20 7 30 0"/>
      <path d="M120 356c2-8 6-13 12-16"/>
    </g>
    <circle cx="112" cy="332" r="4" fill="#241C2E" stroke="none"/>
    <circle cx="338" cy="150" r="3.5" fill="#241C2E" stroke="none"/>
    <circle cx="386" cy="190" r="2.5" fill="#241C2E" stroke="none"/>
    <circle cx="72" cy="438" r="2.5" fill="#241C2E" stroke="none"/>
    <circle cx="466" cy="344" r="2.5" fill="#241C2E" stroke="none"/>
  </g>
</svg>
