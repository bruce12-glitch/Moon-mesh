  <title id="heroArtTitle">Miso the kitten reading on a crescent moon</title>
  <desc id="heroArtDesc">Miso, a cream kitten with a red bandana, sits on a big yellow crescent moon with an open coloring book and a red crayon. Pip the star floats nearby, Plum the rabbit waves from the hill, and Sprout the snail sits by a mushroom.</desc>

